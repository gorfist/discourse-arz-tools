en:
  site_settings:
    discourse_arz_tools_enabled: "Enable the discourse-arz-tools plugin."
    discourse_arz_tools_chat_channel_message_counts_enabled: "Enable the cached chat channel message counts API."
    discourse_arz_tools_chat_channel_message_counts_cache_ttl_seconds: "How long fresh chat channel message counts stay cached, in seconds. Minimum is 12 hours."
    discourse_arz_tools_chat_channel_message_counts_stale_ttl_seconds: "How long stale chat channel message counts can be served if refresh fails, in seconds."
    discourse_arz_tools_chat_channel_message_counts_rate_limit_per_minute: "Maximum requests per minute per user for the chat channel message counts API."
    discourse_arz_tools_api_topic_views_enabled: "Enable API-based topic view tracking."
    discourse_arz_tools_api_topic_views_require_header: "Optional header required to count API topic views."
    discourse_arz_tools_api_topic_views_max_per_minute_per_ip: "Maximum API topic views per minute per IP and topic. Use 0 to disable this limiter."
    discourse_arz_tools_topic_view_beacon_enabled: "Enable the private, admin-authenticated topic view beacon API."
    discourse_arz_tools_topic_view_beacon_dedupe_seconds: "Seconds before the same visitor can count another view for the same topic."
    discourse_arz_tools_topic_view_beacon_max_requests_per_minute: "Maximum topic view beacon requests accepted globally per minute."
    discourse_arz_tools_topic_view_beacon_sql_batch_size: "Maximum number of topics updated by each SQL statement during a buffered view flush."
    discourse_arz_tools_webview_auth_enabled: "Enable automatic Hub login from an app WebView access token."
    discourse_arz_tools_webview_auth_idp_url: "IDP endpoint used to validate app WebView access tokens."
    discourse_arz_tools_webview_auth_timeout_seconds: "Maximum seconds Hub waits for the IDP WebView identity response."

  discourse_arz_tools:
    disabled: "The chat channel message counts API is disabled."
    chat_disabled: "Chat is disabled."
